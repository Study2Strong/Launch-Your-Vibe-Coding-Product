name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI：PR 與 push main 都會跑，通過與否決定要不要放行合併／部署
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check links in markdown content
        uses: lycheeverse/lychee-action@v2
        with:
          # 排除尚未部署前必然還不存在的自身網址（雞生蛋問題）
          args: >-
            --verbose --no-progress
            --exclude 'https://study2strong\.github\.io/Launch-Your-Vibe-Coding-Product.*'
            'docs/**/*.md' 'README.md'
          fail: true

  # CD／建置：只在 push main 且 CI 通過後才會觸發
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run docs:build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload build output as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # CD／部署：發布 build job 產出的 artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
